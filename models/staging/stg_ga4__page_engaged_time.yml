version: 2

models:  
  - name: stg_ga4__page_engaged_time
    description: View that calculates the numerator and denominator for engagement time metrics.
    columns:
      - name: page_engagement_time_msec
        description: Average engagement time, in milliseconds, for a page in a session. The total engagement_time_msec recorded for the page divided by the number of page_view events in the session to the same page_location. Null when no engagement time was recorded.
      - name: page_engagement_denominator
        description: The total number of page_views in a session to the same page_location except for pages with no page_engagement_time.
