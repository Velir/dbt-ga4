[project]
name = "dbt-ga4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-bigquery>=1.10.3,<2.0.0",
    "dbt-core>=1.10.15,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-dotenv>=0.5.2",
]

[tool.pytest.ini_options]
# `dbt deps` in integration_test_project/ installs this package into
# integration_test_project/dbt_packages/ga4/ — a full copy of the repo,
# including the root conftest.py. pytest would otherwise walk into that copy,
# find a conftest declaring `pytest_plugins` below the rootdir, and abort
# collection with the same error the root conftest exists to avoid.
#
# Without this, `parse.sh` followed by `test.sh` breaks locally even though CI
# happens to survive (its collect job never runs `dbt deps`). Keeping the two
# runnable in either order is the local/CI parity the script layer is for.
norecursedirs = [
    "integration_test_project",
    "dbt_packages",
    "target",
    ".venv",
]
