name: 'ga4'
version: '6.3.0'
config-version: 2

# Ceiling only, deliberately. dbt-core 2.0 is already on PyPI as a prerelease,
# and this package has never been tested against it — without this, consumers
# would upgrade into an unverified combination with no warning from us.
#
# The floor is intentionally loose. CI tests 1.10 and newer (see
# scripts/ci/test.sh), so >=1.0.0 claims more than we verify — but tightening it
# to the tested floor would block installs for consumers on older dbt, which is
# a breaking change and belongs in a major release. Tracked in
# specs/ci-rework/README.md §12.4.
require-dbt-version: [">=1.0.0", "<2.0.0"]
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  ga4:
    +materialized: view
    marts:
      +materialized: table
